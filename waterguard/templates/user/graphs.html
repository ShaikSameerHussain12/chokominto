{% extends 'base.html' %}

{% block title %}Usage Graphs - WaterGuard{% endblock %}

{% block content %}
<div class="mb-4">
    <h2 class="fw-bold text-dark mb-1">Consumption Analytics</h2>
    <p class="text-muted">Analyze your historical monthly usage trends and billing details visually.</p>
</div>

<div class="chart-container">
    <h5 class="fw-bold text-dark mb-3"><i class="fa-solid fa-chart-line text-primary me-2"></i> Monthly Usage Trend Curve</h5>
    <div style="height: 400px; position: relative;">
        <canvas id="userConsumptionChart"></canvas>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const dates = JSON.parse('{{ dates_json|safe }}');
        const consumption = JSON.parse('{{ consumption_json|safe }}');
        const billing = JSON.parse('{{ billing_json|safe }}');
        
        const ctx = document.getElementById('userConsumptionChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: dates,
                datasets: [
                    {
                        label: 'Consumption (m³)',
                        data: consumption,
                        borderColor: '#008080',
                        backgroundColor: 'rgba(0, 128, 128, 0.05)',
                        borderWidth: 2.5,
                        tension: 0.15,
                        fill: true,
                        yAxisID: 'y'
                    },
                    {
                        label: 'Billing Amount ($)',
                        data: billing,
                        borderColor: '#1e293b',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        tension: 0.1,
                        fill: false,
                        yAxisID: 'y1'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: { font: { family: 'Inter', size: 12, weight: 'bold' } }
                    }
                },
                scales: {
                    x: {
                        grid: { display: false },
                        ticks: { font: { family: 'Inter', size: 11 } }
                    },
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: {
                            display: true,
                            text: 'Volume (Cubic Meters)',
                            font: { family: 'Inter', size: 12, weight: 'bold' }
                        },
                        ticks: { font: { family: 'Inter', size: 11 } }
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: {
                            display: true,
                            text: 'Billing Amount ($)',
                            font: { family: 'Inter', size: 12, weight: 'bold' }
                        },
                        grid: { drawOnChartArea: false },
                        ticks: { font: { family: 'Inter', size: 11 } }
                    }
                }
            }
        });
    });
</script>
{% endblock %}
