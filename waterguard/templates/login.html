<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WaterGuard Anomaly Detector</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
        }
        .btn-teal {
            background-color: #008080;
            color: #ffffff;
            font-weight: 600;
        }
        .btn-teal:hover {
            background-color: #006666;
            color: #ffffff;
        }
        .brand-logo {
            font-size: 2.25rem;
            font-weight: 800;
            color: #1e293b;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .brand-logo i {
            color: #008080;
        }
        .demo-credentials-box {
            background-color: #f1f5f9;
            border: 1px dashed #cbd5e1;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-top: 1.5rem;
            font-size: 0.825rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        
        <div class="brand-logo">
            <i class="fa-solid fa-droplet"></i> WaterGuard
        </div>
        
        <h5 class="text-center text-muted mb-4">Fraud Detection &amp; Decision Support</h5>
        
        {% if messages %}
            <div class="mb-3">
                {% for message in messages %}
                    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} py-2 small" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label fw-semibold small text-muted">Email / Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-envelope"></i></span>
                    <input type="text" name="username" id="id_username" required class="form-control border-start-0 ps-0" placeholder="admin@example.com">
                </div>
            </div>
            
            <div class="mb-4">
                <label for="id_password" class="form-label fw-semibold small text-muted">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" id="id_password" required class="form-control border-start-0 ps-0" placeholder="••••••••">
                </div>
            </div>
            
            <button type="submit" class="btn btn-teal w-100 py-2">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Log In
            </button>
        </form>
        
        <!-- DEVELOPMENT ONLY DEMO CREDENTIALS -->
        <div class="demo-credentials-box">
            <div class="text-uppercase fw-bold text-danger mb-1" style="font-size: 0.7rem; letter-spacing: 0.05em;">
                <i class="fa-solid fa-circle-exclamation"></i> Development Demo Credentials Only
            </div>
            <div class="row">
                <div class="col-6 border-end">
                    <span class="fw-semibold text-dark">Admin Access:</span><br>
                    User: <code>admin@example.com</code><br>
                    Pass: <code>admin123</code>
                </div>
                <div class="col-6 ps-3">
                    <span class="fw-semibold text-dark">Customer Portal:</span><br>
                    User: <code>user@example.com</code><br>
                    Pass: <code>user123</code>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
